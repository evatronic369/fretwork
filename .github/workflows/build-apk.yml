name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Copy the web app into the Android project
        run: npx cap sync android 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$RUNNER_TEMP/build.log"
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fretwork.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fretwork-apk
          path: Fretwork.apk

      - name: Move the "latest" tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fretwork (latest build)
          body: |
            Download **Fretwork.apk** below and open it on your Android phone.
            You may need to allow "Install unknown apps" for your browser or Files app.
          files: Fretwork.apk
          make_latest: true

      - name: Save the build log to the logs branch
        if: always()
        run: |
          mkdir -p /tmp/lg
          if [ -f "$RUNNER_TEMP/build.log" ]; then tail -n 800 "$RUNNER_TEMP/build.log" > /tmp/lg/build-log.txt; else echo "No build log was written (a step before the build failed)." > /tmp/lg/build-log.txt; fi
          cd /tmp/lg
          git init -q -b logs
          git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -q -m "build log"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs
