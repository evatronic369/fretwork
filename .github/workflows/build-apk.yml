name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Fretwork.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fretwork-apk
          path: Fretwork.apk

      - name: Move the "latest" tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fretwork (latest build)
          body: |
            Download **Fretwork.apk** below and open it on your Android phone.
            You may need to allow "Install unknown apps" for your browser or Files app.
          files: Fretwork.apk
          make_latest: true
